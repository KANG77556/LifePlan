name: Verify LifePlan automatic update on Android emulator
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-autoupdate-smoke.yml'
      - '.github/scripts/emulator-autoupdate-smoke.sh'
permissions:
  contents: read
jobs:
  update-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise published Android updater
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-autoupdate-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-updater-diagnostics
          path: artifacts/
          if-no-files-found: ignore
