name: Build LifePlan APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned APK for local signing fallback
        uses: actions/upload-artifact@v4
        with:
          name: LifePlan-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      - name: Sign with persistent key
        env:
          LIFEPLAN_KEYSTORE_B64: ${{ secrets.LIFEPLAN_KEYSTORE_B64 }}
          LIFEPLAN_KEYSTORE_PASS: ${{ secrets.LIFEPLAN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$LIFEPLAN_KEYSTORE_B64"
          test -n "$LIFEPLAN_KEYSTORE_PASS"
          echo "$LIFEPLAN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifeplan-release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/lifeplan-release.jks" --ks-key-alias lifeplan --ks-pass env:LIFEPLAN_KEYSTORE_PASS --key-pass env:LIFEPLAN_KEYSTORE_PASS --out app/build/outputs/apk/release/LifePlan-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/LifePlan-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifePlan-signed-release
          path: app/build/outputs/apk/release/LifePlan-release.apk
          retention-days: 14
