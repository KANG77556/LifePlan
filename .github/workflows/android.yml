name: Build LifePlan Signed APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: 3562bdf44584cecd77831064ab7bf05c80ee2b54b75be9300891be9d8076f7f0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate existing signing credentials
        env:
          LIFEPLAN_KEYSTORE_B64: ${{ secrets.LIFEPLAN_KEYSTORE_B64 }}
          LIFEPLAN_KEYSTORE_PASS: ${{ secrets.LIFEPLAN_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LIFEPLAN_KEYSTORE_B64 LIFEPLAN_KEYSTORE_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret $name is unavailable. Restore the existing signing credentials; do not generate a new key."
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/lifeplan-preflight.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$LIFEPLAN_KEYSTORE_B64" | base64 --decode > "$key"
          keytool -exportcert -keystore "$key" -alias lifeplan -storepass:env LIFEPLAN_KEYSTORE_PASS > "$RUNNER_TEMP/lifeplan-cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/lifeplan-cert.der" | cut -d ' ' -f 1)
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::Signing certificate differs from the existing LifePlan certificate.'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate planner JavaScript and dashboard hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          html=p.read_text(encoding='utf-8')
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/lifeplan-app.js').write_text(js,encoding='utf-8')
          for token in ['renderHome(now)','function saveBatchTemplate()','function loadBatchTemplate()','id="heroTaskCount"','id="homeRecurring"','id="dailyTasks"','versionName']:
              if token!='versionName' and token not in html:
                  raise SystemExit('Missing app hook: '+token)
          PY
          node --check /tmp/lifeplan-app.js
      - name: Test portable encrypted archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/lifeplan-portable/kr/lifeplan/app
          cp app/src/main/java/kr/lifeplan/app/PortableArchive.java /tmp/lifeplan-portable/kr/lifeplan/app/
          cat > /tmp/lifeplan-portable/PortableTest.java <<'JAVA'
          import kr.lifeplan.app.PortableArchive;
          import java.util.Arrays;
          public class PortableTest {
            static void check(boolean ok){if(!ok)throw new AssertionError();}
            public static void main(String[] args)throws Exception {
              char[] password="strong-pass-2026".toCharArray();
              String source="{\\\"tasks\\\":[],\\\"goals\\\":[],\\\"habits\\\":[]}";
              byte[] encrypted=PortableArchive.encrypt(source,password);
              byte[] second=PortableArchive.encrypt(source,password);
              check(!Arrays.equals(encrypted,second));
              check(source.equals(PortableArchive.decrypt(encrypted,password)));
              boolean bad=false;try{PortableArchive.decrypt(encrypted,"wrong-passphrase".toCharArray());}catch(Exception e){bad=true;}check(bad);
              encrypted[encrypted.length-1]^=1;
              bad=false;try{PortableArchive.decrypt(encrypted,password);}catch(Exception e){bad=true;}check(bad);
              check(!PortableArchive.validPassword("short".toCharArray()));
              System.out.println("Portable AES-GCM encryption and wrong-password tests passed");
            }
          }
          JAVA
          javac -d /tmp/lifeplan-portable /tmp/lifeplan-portable/kr/lifeplan/app/*.java /tmp/lifeplan-portable/PortableTest.java
          java -cp /tmp/lifeplan-portable PortableTest
      - name: Test PIN protection and encrypted backup retention rules
        run: |
          set -euo pipefail
          mkdir -p /tmp/lifeplan-security/kr/lifeplan/app
          cp app/src/main/java/kr/lifeplan/app/PinHash.java /tmp/lifeplan-security/kr/lifeplan/app/
          cp app/src/main/java/kr/lifeplan/app/VaultRules.java /tmp/lifeplan-security/kr/lifeplan/app/
          cat > /tmp/lifeplan-security/SecurityTest.java <<'JAVA'
          import java.util.Arrays;
          import kr.lifeplan.app.PinHash;
          import kr.lifeplan.app.VaultRules;
          public class SecurityTest {
            static void check(boolean condition) { if (!condition) throw new AssertionError(); }
            public static void main(String[] args) throws Exception {
              check(!PinHash.valid("123") && !PinHash.valid("123456789"));
              check(!PinHash.valid("a1234") && PinHash.valid("1234"));
              String pin=PinHash.create("841729");
              check(!pin.contains("841729"));
              check(PinHash.verify(pin,"841729") && !PinHash.verify(pin,"111111"));
              check(!PinHash.verify("invalid","1234"));
              check(!PinHash.create("841729").equals(pin)); // randomized salt
              check(VaultRules.trustedName("backup-1792497600000.lpb"));
              check(!VaultRules.trustedName("../backup-1792497600000.lpb"));
              check(!VaultRules.trustedName("backup-1792497600000.lpb.tmp"));
              check(VaultRules.timestamp("backup-1792497600000.lpb")==1792497600000L);
              check(VaultRules.preferredName(Arrays.asList("backup-1792497600000.lpb"),1792497601000L,false).equals("backup-1792497600000.lpb"));
              check(VaultRules.preferredName(Arrays.asList("backup-1792497600000.lpb"),1792497601000L,true).equals("backup-1792497601000.lpb"));
              check(VaultRules.preferredName(Arrays.asList("backup-1792497600000.lpb"),1792499000000L,false).equals("backup-1792499000000.lpb"));
              check(VaultRules.KEEP==7);
              System.out.println("PIN hashing, rate-safe validation and rolling backup rules passed");
            }
          }
          JAVA
          javac -d /tmp/lifeplan-security /tmp/lifeplan-security/kr/lifeplan/app/*.java /tmp/lifeplan-security/SecurityTest.java
          java -cp /tmp/lifeplan-security SecurityTest
      - name: Check native privacy and backup wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          activity=Path('app/src/main/java/kr/lifeplan/app/MainActivity.java').read_text()
          vault=Path('app/src/main/java/kr/lifeplan/app/BackupVault.java').read_text()
          lock=Path('app/src/main/java/kr/lifeplan/app/PrivacyLock.java').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android:fullBackupContent="false"' in manifest
          for token in ['autoBackup(String json)','restoreEncryptedBackup(String name,String currentJson)','externalOrBlock(String url)','privacyLock.onPause()','backupVault.close()']:
              assert token in activity,token
          for token in ['AES/GCM/NoPadding','AndroidKeyStore','getNoBackupFilesDir','getFD().sync()','VaultRules.KEEP']:
              assert token in vault,token
          assert 'forceNewAfterRestore=true;' in vault
          assert 'persist(json,force);' in vault
          assert 'persist(currentJson,true);' in vault
          for token in ['FLAG_SECURE','PinHash.verify','lockDialog.setCancelable(false)']:
              assert token in lock,token
          for token in ['id="vaultBackupSelect"','id="privacyStatus"','window.LifePlanVaultRestored','LifePlanNative?.autoBackup','function restoreVault()']:
              assert token in html,token
          print('Native vault, PIN gate, no cloud plaintext backup and JS integration are connected')
          PY
      - name: Test dated diary and monthly mood insights
        run: |
          node <<'NODE'
          const assert=require('assert'),D=require('./app/src/main/assets/diary-insights.js');
          assert(!D.parseDate('2026-02-29'));
          assert(D.parseDate('2024-02-29'));
          const moods=D.normalizeMoods({'2026-10-18':'good','2026-10-19':'great','2026-10-20':'okay','invalid':'hard','2026-10-25':'invalid'});
          assert(Object.keys(moods).length===3);
          const notes={'2026-10-18':'하루','2026-10-19':'좋았다'};
          assert(D.currentStreak(notes,moods,'2026-10-20')===3);
          const stats=D.monthSummary(notes,moods,'2026-10','2026-10-20');
          assert(stats.recordedDays===3&&stats.moodDays===3&&stats.textDays===2);
          assert(stats.consistency===15);
          assert(D.normalizeMonthlyReviews({'2026-10':'한 달 정리','2026-13':'잘못된 월'})['2026-10']==='한 달 정리');
          assert(!D.normalizeMonthlyReviews({'2026-13':'잘못된 월'})['2026-13']);
          console.log('Diary mood and monthly review tests passed');
          NODE
      - name: Test dated execution analytics
        run: |
          node <<'NODE'
          const assert=require('assert');
          const A=require('./app/src/main/assets/execution-analytics.js');
          assert(A.parseDay('2026-02-29')===null);
          assert(A.parseDay('2024-02-29')!==null);
          assert(A.addDay('2026-12-31',1)==='2027-01-01');
          assert(A.weekDays('2026-10-20')[0]==='2026-10-19');
          const monday=[{id:1,name:'업무',start:'09:00',end:'10:00'}];
          let record=A.snapshot(monday,'2026-10-19','timestamp');
          assert(A.dayStats(record).rate===0);
          record=A.setChecked(record,1,true,'2026-10-19T10:00:00Z');
          assert(A.dayStats(record).rate===100);
          record=A.reconcile(record,[{id:1,name:'업무 변경',start:'09:00',end:'10:00'},{id:2,name:'운동',start:'11:00',end:'12:00'}]);
          assert(A.dayStats(record).rate===50);
          const log=A.normalizeLog({'2026-10-19':record,'not-a-date':record});
          assert(Object.keys(log).length===1);
          const week=A.periodStats(log,A.weekDays('2026-10-20'),'2026-10-20');
          assert(week.trackedDays===1 && week.done===1 && week.total===2 && week.rate===50);
          assert(A.periodStats({},A.weekDays('2026-10-20'),'2026-10-20').rate===null);
          console.log('Date-keyed execution stats tests passed');
          NODE
      - name: Test weekday-default and dated special plan behavior
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const source=html.split('<script>',2)[1].split('</script>',1)[0];
          // Basic source-contract tests catch accidental removal of override precedence.
          for(const token of ['baseTasksFor','tasksFor=s=>isSpecial(s)?','db.specialPlans[s].tasks','validPlanDate','specialClone'])assert(source.includes(token),token);
          assert(source.includes("const isSpecial=s=>Object.prototype.hasOwnProperty.call(db.specialPlans,s)"));
          assert(source.includes("JSON.stringify({tasks:db.tasks||[],specialPlans:db.specialPlans||{}"));
          assert(source.includes("x.specialPlans=x.specialPlans&&typeof x.specialPlans==='object'"));
          assert(source.includes("function removeSpecialDate(s)"));
          console.log('Dated exception UI/data/native hooks present');
          NODE
      - name: Test auto-update URL and version validation
        run: |
          mkdir -p /tmp/lifeplan-updater-test/kr/lifeplan/app
          cp app/src/main/java/kr/lifeplan/app/UpdateUtil.java /tmp/lifeplan-updater-test/kr/lifeplan/app/
          cat > /tmp/lifeplan-updater-test/UpdateUtilTest.java <<'JAVA'
          import kr.lifeplan.app.UpdateUtil;
          public class UpdateUtilTest {
            static void check(boolean ok) { if (!ok) throw new AssertionError(); }
            public static void main(String[] args) {
              check(UpdateUtil.compareVersions("0.4.10", "0.4.9") > 0);
              check(UpdateUtil.compareVersions("0.4.1", "0.4.1") == 0);
              check(UpdateUtil.compareVersions("0.4.1", "0.4.2") < 0);
              check(UpdateUtil.isPendingInstalled("0.4.3", "0.4.2"));
              check(!UpdateUtil.isPendingInstalled("0.4.1", "0.4.2"));
              check(UpdateUtil.shouldAutoOpenInstaller(true, false));
              check(!UpdateUtil.shouldAutoOpenInstaller(true, true));
              check(!UpdateUtil.shouldAutoOpenInstaller(false, false));
              String url="https://github.com/KANG77556/LifePlan/releases/download/v0.4.2/LifePlan-release.apk";
              check("0.4.2".equals(UpdateUtil.versionFromTrustedUrl(url)));
              check(UpdateUtil.versionFromTrustedUrl("https://github.com.evil.test/KANG77556/LifePlan/releases/download/v0.4.2/LifePlan-release.apk")==null);
              check(UpdateUtil.versionFromTrustedUrl(url+"?redirect=1")==null);
              check(UpdateUtil.githubSha256("sha256:"+"a".repeat(64)).equals("a".repeat(64)));
              check(UpdateUtil.githubSha256("sha256:invalid")==null);
            }
          }
          JAVA
          javac -d /tmp/lifeplan-updater-test /tmp/lifeplan-updater-test/kr/lifeplan/app/UpdateUtil.java /tmp/lifeplan-updater-test/UpdateUtilTest.java
          java -cp /tmp/lifeplan-updater-test UpdateUtilTest
      - name: Check updater lifecycle wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          updater=Path('app/src/main/java/kr/lifeplan/app/AppUpdater.java').read_text()
          activity=Path('app/src/main/java/kr/lifeplan/app/MainActivity.java').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          checks=[
              (updater,'P_AUTOMATIC_DOWNLOAD'),
              (updater,'clearPending(pending)'),
              (updater,'beginDownload(latest, automatic)'),
              (updater,'private boolean pendingAlreadyInstalled()'),
              (updater,'prefs.edit().putBoolean(P_INSTALL_OFFERED, true)'),
              (updater,'UpdateUtil.shouldAutoOpenInstaller'),
              (activity,'updater.onResume()'),
              (activity,'updater.onDestroy()'),
              (activity,'updater.setAutoEnabled(value)'),
              (html,'id="autoUpdate"'),
              (html,'function retryUpdateDownload()'),
          ]
          for source,token in checks:
              assert token in source, f'Missing updater hook: {token}'
          import re
          gradle=Path('app/build.gradle').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          match=re.search(r"versionName '([0-9]+[.][0-9]+[.][0-9]+)'", gradle)
          assert match, 'Missing valid versionName in gradle'
          assert 'v'+match.group(1) in html, 'UI version does not match Gradle version'
          print('Updater lifecycle wiring checks passed')
          PY
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify with existing key
        env:
          LIFEPLAN_KEYSTORE_B64: ${{ secrets.LIFEPLAN_KEYSTORE_B64 }}
          LIFEPLAN_KEYSTORE_PASS: ${{ secrets.LIFEPLAN_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/lifeplan-release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$LIFEPLAN_KEYSTORE_B64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          "$tools/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias lifeplan --ks-pass env:LIFEPLAN_KEYSTORE_PASS --key-pass env:LIFEPLAN_KEYSTORE_PASS --out release/LifePlan-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs release/LifePlan-release.apk | tee release/certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/certificate.txt)
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$tools/zipalign" -c -p 4 release/LifePlan-release.apk
          (cd release && sha256sum LifePlan-release.apk > SHA256SUMS)
          printf 'Source commit: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/build-info.txt
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: LifePlan-signed-release
          path: |
            release/LifePlan-release.apk
            release/SHA256SUMS
            release/certificate.txt
            release/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping to avoid overwriting the published APK."
            exit 0
          fi
          gh release create "$tag" release/LifePlan-release.apk release/SHA256SUMS release/certificate.txt release/build-info.txt --title "LifePlan $tag" --notes "Signed LifePlan Android update. Existing signing certificate preserved. Includes refreshed daily planner UI and weekday/weekend batch schedule entry." --target "$GITHUB_SHA"
