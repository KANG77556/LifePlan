name: Build LifePlan Signed APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: 3562bdf44584cecd77831064ab7bf05c80ee2b54b75be9300891be9d8076f7f0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate existing signing credentials
        env:
          LIFEPLAN_KEYSTORE_B64: ${{ secrets.LIFEPLAN_KEYSTORE_B64 }}
          LIFEPLAN_KEYSTORE_PASS: ${{ secrets.LIFEPLAN_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LIFEPLAN_KEYSTORE_B64 LIFEPLAN_KEYSTORE_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret $name is unavailable. Restore the existing signing credentials; do not generate a new key."
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/lifeplan-preflight.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$LIFEPLAN_KEYSTORE_B64" | base64 --decode > "$key"
          keytool -exportcert -keystore "$key" -alias lifeplan -storepass:env LIFEPLAN_KEYSTORE_PASS > "$RUNNER_TEMP/lifeplan-cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/lifeplan-cert.der" | cut -d ' ' -f 1)
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::Signing certificate differs from the existing LifePlan certificate.'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate planner JavaScript and dashboard hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          html=p.read_text(encoding='utf-8')
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/lifeplan-app.js').write_text(js,encoding='utf-8')
          for token in ['renderHome(now)','function saveBatchTemplate()','function loadBatchTemplate()','id="heroTaskCount"','id="homeRecurring"','id="dailyTasks"','versionName']:
              if token!='versionName' and token not in html:
                  raise SystemExit('Missing app hook: '+token)
          PY
          node --check /tmp/lifeplan-app.js
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify with existing key
        env:
          LIFEPLAN_KEYSTORE_B64: ${{ secrets.LIFEPLAN_KEYSTORE_B64 }}
          LIFEPLAN_KEYSTORE_PASS: ${{ secrets.LIFEPLAN_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/lifeplan-release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$LIFEPLAN_KEYSTORE_B64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          "$tools/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias lifeplan --ks-pass env:LIFEPLAN_KEYSTORE_PASS --key-pass env:LIFEPLAN_KEYSTORE_PASS --out release/LifePlan-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs release/LifePlan-release.apk | tee release/certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/certificate.txt)
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$tools/zipalign" -c -p 4 release/LifePlan-release.apk
          (cd release && sha256sum LifePlan-release.apk > SHA256SUMS)
          printf 'Source commit: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/build-info.txt
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: LifePlan-signed-release
          path: |
            release/LifePlan-release.apk
            release/SHA256SUMS
            release/certificate.txt
            release/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping to avoid overwriting the published APK."
            exit 0
          fi
          gh release create "$tag" release/LifePlan-release.apk release/SHA256SUMS release/certificate.txt release/build-info.txt --title "LifePlan $tag" --notes "Signed LifePlan Android update. Existing signing certificate preserved. Includes refreshed daily planner UI and weekday/weekend batch schedule entry." --target "$GITHUB_SHA"
