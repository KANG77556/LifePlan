name: Build LifePlan APK (Unsigned for Local Signing)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate unsigned APK
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifePlan-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
