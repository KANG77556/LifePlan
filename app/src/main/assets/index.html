<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>라이프플랜</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fd;color:#23304d;font:15px system-ui,'Noto Sans KR',sans-serif}header{background:linear-gradient(130deg,#7187e9,#a3b3f0);color:white;padding:42px 22px 23px;border-radius:0 0 26px 26px}header h1{margin:3px 0;font-size:25px}header small{opacity:.85}.wrap{max-width:560px;margin:auto;padding:16px 15px 88px}.card{background:white;padding:18px;border-radius:22px;margin-bottom:15px;box-shadow:0 6px 20px #253b7010}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{font-size:13px;color:#8590a7}h3{margin:0 0 10px;font-size:17px}.btn{background:#6c86e6;border:0;border-radius:13px;color:white;padding:11px 14px;font-weight:700}.soft{background:#eff2fb;color:#6073a3;border:0;border-radius:10px;padding:8px 11px}#dial{display:block;width:100%;max-width:350px;margin:14px auto;touch-action:none}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#f3f5fa;border-radius:14px;padding:7px 10px;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f6}.item:last-child{border:0}.grow{flex:1}.sub{font-size:12px;color:#8390a7}.page{display:none}.page.on{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;padding:8px 2px max(10px,env(safe-area-inset-bottom));border-top:1px solid #e9edf7}nav button{flex:1;border:0;background:none;color:#8d98ae;font-size:12px;padding:9px 3px}nav button.on{color:#5b77de;font-weight:bold}dialog{border:0;border-radius:22px;width:min(94%,420px);padding:23px;box-shadow:0 25px 70px #18294966}dialog::backdrop{background:#24335088}label{display:block;margin:11px 0 5px;font-size:13px;color:#65758d}input,select{width:100%;padding:11px;border:1px solid #dbe2f2;border-radius:11px;font:inherit}input[type=color]{height:44px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.bar{height:8px;background:#e9eefb;border-radius:5px;overflow:hidden}.bar i{display:block;background:#758de9;height:100%}
</style></head><body><header><div style="max-width:560px;margin:auto"><small>나의 하루, 나의 미래</small><h1>라이프플랜 <small style="font-size:11px">v0.2.2</small></h1><div id="today"></div></div></header><div class="wrap">
<section class="page on" id="daily"><div class="card"><div class="flex"><div><h3>24시간 생활계획표</h3><div class="muted">구간을 터치하면 시간을 수정할 수 있어요</div></div><button class="btn" onclick="editTask()">+ 일정</button></div><svg id="dial" viewBox="0 0 350 350"></svg><div id="legend" class="chips"></div></div><div class="card"><div class="flex"><h3>오늘의 일정</h3><span id="count" class="sub"></span></div><div id="tasks"></div></div></section>
<section class="page" id="weekly"><div class="card"><h3>주간 계획</h3><div class="muted">요일별 반복되는 일정을 보여줍니다.</div><div id="week"></div></div></section>
<section class="page" id="goals"><div class="card"><div class="flex"><h3>인생 목표</h3><button class="btn" onclick="editGoal()">+ 목표</button></div><div id="goallist"></div></div></section>
<section class="page" id="habits"><div class="card"><div class="flex"><h3>습관 체크</h3><button class="btn" onclick="editHabit()">+ 습관</button></div><div id="habitlist"></div></div></section>
<section class="page" id="settings"><div class="card"><h3>설정</h3><p class="muted">설치 버전: 0.2.2</p><button class="btn" onclick="update()">업데이트 확인</button><p id="updateStatus" class="muted"></p><h3>데이터</h3><p class="muted">앱을 삭제하면 저장된 데이터도 사라질 수 있습니다. 중요한 일정은 정기적으로 백업하세요.</p><button class="soft" onclick="backup()">백업(JSON)</button><button class="soft" onclick="document.getElementById('upload').click()">복원</button><input hidden id="upload" type="file" accept="application/json" onchange="restore(this)"></div></section></div>
<nav><button class="on" onclick="tab('daily',this)">오늘</button><button onclick="tab('weekly',this)">주간</button><button onclick="tab('goals',this)">목표</button><button onclick="tab('habits',this)">습관</button><button onclick="tab('settings',this)">설정</button></nav>
<dialog id="taskDialog"><h3>일정 편집</h3><input id="tid" type="hidden"><label>활동명</label><input id="tname" maxlength="30" placeholder="예: 운동"><label>시작</label><input id="start" type="time"><label>종료</label><input id="end" type="time"><label>활동 색상</label><input id="color" type="color"><label>반복</label><select id="repeat"><option value="all">매일</option><option value="weekday">평일</option><option value="weekend">주말</option><option value="once">오늘만</option></select><div class="actions"><button class="soft" id="deleteTask" onclick="removeTask()">삭제</button><button class="soft" onclick="taskDialog.close()">취소</button><button class="btn" onclick="saveTask()">저장</button></div></dialog>
<dialog id="goalDialog"><h3>목표</h3><input type="hidden" id="gid"><label>목표 이름</label><input id="gname" maxlength="60"><label>기간</label><select id="horizon"><option>1년</option><option>5년</option><option>10년</option></select><label>진행률(%)</label><input id="progress" type="number" min="0" max="100"><div class="actions"><button class="soft" onclick="goalDialog.close()">취소</button><button class="btn" onclick="saveGoal()">저장</button></div></dialog>
<dialog id="habitDialog"><h3>습관 추가</h3><input id="hname" maxlength="40" placeholder="예: 매일 30분 운동"><div class="actions"><button class="soft" onclick="habitDialog.close()">취소</button><button class="btn" onclick="saveHabit()">저장</button></div></dialog>
<script>
const K='lifeplan.v1',D=['일','월','화','수','목','금','토'],$=id=>document.getElementById(id),date=()=>new Date().toLocaleDateString('sv-SE'),min=s=>{let a=s.split(':').map(Number);return a[0]*60+a[1]},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}if(!db||!Array.isArray(db.tasks))db={tasks:[{id:1,name:'수면',start:'00:00',end:'07:00',color:'#91a6ee',repeat:'all'},{id:2,name:'아침 준비',start:'07:00',end:'08:00',color:'#f6c687',repeat:'all'},{id:3,name:'업무·공부',start:'09:00',end:'12:00',color:'#8ad3b1',repeat:'weekday'},{id:4,name:'운동',start:'18:00',end:'19:00',color:'#efaab1',repeat:'all'}],goals:[],habits:[]};db.goals||=[];db.habits||=[];
const active=(t,d=new Date().getDay())=>t.repeat==='all'||t.repeat==='weekday'&&d>0&&d<6||t.repeat==='weekend'&&(d===0||d===6)||t.repeat==='once'&&t.date===date();
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function tab(n,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===n));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function path(a,b){const p=x=>[175+123*Math.cos((x-90)*Math.PI/180),175+123*Math.sin((x-90)*Math.PI/180)],s=p(a),e=p(b);return 'M'+s.join(' ')+' A123 123 0 '+(b-a>180?1:0)+' 1 '+e.join(' ')}
function render(){let now=new Date();$('today').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});let a=db.tasks.filter(t=>active(t)&&min(t.end)>min(t.start)).sort((x,y)=>min(x.start)-min(y.start));let svg=$('dial');svg.innerHTML='<circle cx="175" cy="175" r="123" fill="none" stroke="#e9edf8" stroke-width="42"/>';for(let t of a)svg.innerHTML+='<path data-id="'+t.id+'" d="'+path(min(t.start)/4,min(t.end)/4)+'" stroke="'+t.color+'" stroke-width="42" fill="none"/>';for(let h=0;h<24;h+=3){let z=(h*15-90)*Math.PI/180;svg.innerHTML+='<text x="'+(175+86*Math.cos(z))+'" y="'+(179+86*Math.sin(z))+'" text-anchor="middle" font-size="12" fill="#71819f">'+h+'</text>'}svg.innerHTML+='<text x="175" y="167" text-anchor="middle" fill="#273752" font-size="18" font-weight="bold">나의 하루</text><text x="175" y="189" text-anchor="middle" fill="#8391a9" font-size="12">24시간 계획표</text>';svg.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>editTask(+x.dataset.id));$('legend').innerHTML=a.map(t=>'<span class="chip"><i class="dot" style="background:'+t.color+'"></i>'+esc(t.name)+'</span>').join('');$('count').textContent=a.length+'개';$('tasks').innerHTML=a.map(t=>'<div class="item" onclick="editTask('+t.id+')"><i class="dot" style="background:'+t.color+'"></i><div class="grow"><b>'+esc(t.name)+'</b><div class="sub">'+t.start+' – '+t.end+'</div></div><span class="sub">편집 ›</span></div>').join('');$('week').innerHTML=Array.from({length:7},(_,i)=>{let d=(i+1)%7,z=db.tasks.filter(t=>active(t,d));return '<div class="item"><b>'+D[d]+'</b><span class="grow muted">'+z.map(t=>esc(t.name)).join(' · ')+'</span><small>'+z.length+'개</small></div>'}).join('');$('goallist').innerHTML=db.goals.map(g=>'<div class="item" onclick="editGoal('+g.id+')"><div class="grow"><b>'+esc(g.name)+'</b><div class="sub">'+g.horizon+' · '+g.progress+'%</div><div class="bar"><i style="width:'+g.progress+'%"></i></div></div></div>').join('')||'<p class="muted">목표를 추가해 보세요.</p>';$('habitlist').innerHTML=db.habits.map(h=>'<div class="item"><input style="width:22px" type="checkbox" '+(h.done===date()?'checked':'')+' onchange="habitCheck('+h.id+',this.checked)"><div class="grow">'+esc(h.name)+'</div><button class="soft" onclick="habitDelete('+h.id+')">삭제</button></div>').join('')||'<p class="muted">매일 실천할 습관을 등록하세요.</p>'}
function editTask(id){let t=db.tasks.find(x=>x.id===id);$('tid').value=t?.id||'';$('tname').value=t?.name||'';$('start').value=t?.start||'09:00';$('end').value=t?.end||'10:00';$('color').value=t?.color||'#8ab9e8';$('repeat').value=t?.repeat||'all';$('deleteTask').hidden=!t;$('taskDialog').showModal()}
function saveTask(){let name=$('tname').value.trim(),start=$('start').value,end=$('end').value;if(!name||min(start)>=min(end)){alert('활동명과 시간 범위를 확인하세요.');return}let id=+$('tid').value||Date.now(),t={id,name,start,end,color:$('color').value,repeat:$('repeat').value};if(t.repeat==='once')t.date=date();let i=db.tasks.findIndex(x=>x.id===id);if(i<0)db.tasks.push(t);else db.tasks[i]=t;$('taskDialog').close();save()}function removeTask(){db.tasks=db.tasks.filter(x=>x.id!==+$('tid').value);$('taskDialog').close();save()}
function editGoal(id){let g=db.goals.find(x=>x.id===id);$('gid').value=g?.id||'';$('gname').value=g?.name||'';$('horizon').value=g?.horizon||'1년';$('progress').value=g?.progress||0;$('goalDialog').showModal()}function saveGoal(){let name=$('gname').value.trim();if(!name)return;let id=+$('gid').value||Date.now(),g={id,name,horizon:$('horizon').value,progress:Math.max(0,Math.min(100,Number($('progress').value)||0))},i=db.goals.findIndex(x=>x.id===id);if(i<0)db.goals.push(g);else db.goals[i]=g;$('goalDialog').close();save()}
function editHabit(){$('hname').value='';$('habitDialog').showModal()}function saveHabit(){let name=$('hname').value.trim();if(name)db.habits.push({id:Date.now(),name,done:''});$('habitDialog').close();save()}function habitCheck(id,v){let h=db.habits.find(x=>x.id===id);if(h)h.done=v?date():'';save()}function habitDelete(id){db.habits=db.habits.filter(h=>h.id!==id);save()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lifeplan-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function restore(e){let f=e.files[0];if(!f)return;f.text().then(s=>{let x=JSON.parse(s);if(!Array.isArray(x.tasks)||!Array.isArray(x.goals)||!Array.isArray(x.habits))throw Error();if(confirm('현재 데이터를 복원 파일로 교체할까요?')){db=x;save()}}).catch(()=>alert('잘못된 백업 파일입니다.'))}
async function update(){let v=$('updateStatus');v.textContent='업데이트 확인 중…';try{let r=await fetch('https://api.github.com/repos/KANG77556/LifePlan/releases/latest');if(!r.ok)throw Error();let j=await r.json();v.textContent='최신 배포: '+j.tag_name+' — ';let a=document.createElement('a');a.href=j.html_url;a.textContent='다운로드 페이지';v.appendChild(a)}catch(e){v.textContent='아직 공개된 업데이트가 없거나 연결할 수 없습니다.'}}
render();</script></body></html>
